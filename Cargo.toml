[package]
name = "tiktoken"
version = "0.13.0"
edition = "2024"

[lib]
name = "tiktoken"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = [
    "pyo3",
    "mimalloc",
]

[dependencies]
pyo3 = { version = "0.28.3", default-features = false, features = [
    "extension-module",
    "macros",
], optional = true }

# tiktoken dependencies
fancy-regex = "0.17.0"
regex = "1.10.3"
rustc-hash = "2"
bstr = "1.5.0"

# mimalloc is deliberately excluded on musl targets: `libmimalloc-sys` compiles
# mimalloc with `-ftls-model=initial-exec` and without `MI_LIBC_MUSL`, both of
# which are unsupported when the resulting `cdylib` is `dlopen`ed into CPython
# under musl libc, and the extension module segfaults while initialising.
# See microsoft/mimalloc#644 and microsoft/mimalloc#883.
[target.'cfg(not(target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
